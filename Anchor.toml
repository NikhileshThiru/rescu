[toolchain]
anchor_version = "1.1.2"
solana_version = "3.1.10"
package_manager = "pnpm"

[features]
resolution = true
skip-lint = false

[programs.localnet]
rescu = "GrxgRShVcGaESyztvHHtaCF8YMXVhK3Wq7AesbQCaLy5"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "pnpm --filter @rescu/chain-tests test"

[hooks]

[test]
startup_wait = 20000
shutdown_wait = 2000
upgradeable = false

[test.validator]
bind_address = "127.0.0.1"
ledger = ".anchor/test-ledger"
limit_ledger_size = "10000000"
rpc_port = 8899
